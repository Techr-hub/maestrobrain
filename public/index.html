<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maestro · Control Centre</title>
  <meta name="description" content="Maestro: your personal AI second brain built on Claude, Obsidian and MCP.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Roboto+Condensed:wght@400&family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="greeting"><h1 id="greet">Good morning</h1><p id="greet-sub">Let's make today extraordinary.</p></div>
      <div class="clock"><div class="date" id="clock-date"></div><div class="time" id="clock-time"></div></div>
      <div class="actions">
        <div class="profile-switch" id="profile-switch" role="tablist" aria-label="Profile">
          <button data-profile="business" role="tab"></button>
          <button data-profile="personal" role="tab"></button>
        </div>
        <div class="profile-switch voice-switch" id="voice-switch" role="radiogroup" aria-label="Maestro's voice">
          <button data-gender="male" role="radio" title="Man's voice" aria-label="Man's voice"></button>
          <button data-gender="female" role="radio" title="Woman's voice" aria-label="Woman's voice"></button>
        </div>
        <button class="icon-btn" id="bell" title="Notifications"><span id="bell-icon"></span><span class="dot" id="bell-dot" hidden></span></button>
        <button class="icon-btn feed-toggle" id="feed-toggle" title="Intelligence feed"></button>
        <button class="icon-btn settings-btn" id="prefs" title="Settings"></button>
        <div class="operator" title="Operator">
          <span class="status-dot" id="op-dot"></span>
          <div class="presence"><b id="op-name">Ryan</b><small id="op-status">ONLINE</small></div>
          <div class="avatar" id="op-avatar">R</div>
        </div>
      </div>
    </header>

    <div class="workspace" id="workspace">
      <nav class="sidebar" aria-label="Primary">
        <div class="brand">
          <div class="brand-avatar" id="brand-avatar" title="Talk to Maestro"><canvas id="avatar-canvas"></canvas></div>
          <div class="brand-name">MAESTRO</div>
          <div class="brand-desc">Second Brain Command</div>
        </div>
        <div id="nav"></div>
        <button class="nav-item sidebar-toggle" id="sidebar-toggle" title="Expand menu"><span class="toggle-icon"></span><span class="label">Collapse menu</span></button>
      </nav>

      <main class="main" id="main"></main>

      <aside class="feed" id="feed">
        <div class="feed-head">
          <h3>INTELLIGENCE FEED</h3>
          <div class="feed-controls">
            <button class="live" id="live-toggle" title="Pause or resume the live feed"></button>
            <select class="select" id="source-filter" aria-label="Filter by source"><option value="all">All Sources</option></select>
            <button class="ctrl" id="cat-filter" title="Filter by category">☷</button>
          </div>
        </div>
        <div class="feed-list" id="feed-list"></div>
        <div class="feed-foot"><button id="feed-all">View all activity <span id="arrow"></span></button></div>
      </aside>
    </div>
  </div>
  <div class="toasts" id="toasts"></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
